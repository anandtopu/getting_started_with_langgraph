[build-system]
requires = ["hatchling>=1.33.0,<1.34"]
build-backend = "hatchling.build"

[project]
name = "getting-started-with-langgraph"
version = "0.2.0"
description = "An offline-first LangGraph course and graded Larkspur Claims Practice Gym."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "langgraph>=1.2.20,<1.3",
  "langchain-core>=1.7.6,<1.8",
  "langchain>=1.4.9,<1.5",
  "langgraph-checkpoint>=4.3.1,<4.4",
  "langgraph-checkpoint-sqlite>=3.1.3,<3.2",
  "pydantic>=2.14.3,<2.15",
  "python-dotenv>=1.2.4,<1.3",
  "PyYAML>=6.0.3,<7",
  "rich>=15.0.0,<16",
]

[project.scripts]
gym = "gym.cli:main"

[project.optional-dependencies]
openai = ["langchain-openai>=1.7.4,<1.8"]
anthropic = ["langchain-anthropic>=1.7.10,<1.8"]
google = ["langchain-google-genai>=4.4.3,<4.5"]
ollama = ["langchain-ollama>=1.1.0,<1.2"]
llm = [
  "langchain-openai>=1.7.4,<1.8",
  "langchain-anthropic>=1.7.10,<1.8",
  "langchain-google-genai>=4.4.3,<4.5",
  "langchain-ollama>=1.1.0,<1.2",
]
persistence = [
  "langgraph-checkpoint-postgres>=3.2.0,<3.3",
  "psycopg[binary,pool]>=3.3.8,<3.4",
]
mcp = ["langchain-mcp-adapters>=0.3.2,<0.4", "mcp>=1.30.0,<2"]
apps = ["fastapi>=0.162.0,<0.163", "uvicorn>=0.54.0,<0.55", "streamlit>=1.67.0,<1.68", "httpx>=0.28.1,<0.29"]
deploy = ["langgraph-cli[inmem]>=0.4.42,<0.5", "langgraph-sdk>=0.4.14,<0.5", "langsmith>=0.14.17,<0.15"]
eval = ["agentevals>=0.0.9,<0.1"]
notebooks = ["jupyter>=1.1.1,<2", "nbformat>=5.11.1,<6", "nbclient>=0.11.0,<0.12"]
data = ["reportlab>=5.1.0,<5.2"]
security = ["pycryptodome>=4.3.0,<4.4"]
bonus = ["deepagents>=0.7.34,<0.8"]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<9.3",
  "pytest-asyncio>=1.4.1.post1,<1.5",
  "pytest-socket>=0.8.1,<0.9",
  "ruff>=0.17.4,<0.18",
  "reportlab>=5.1.0,<5.2",
]
maintain = ["pre-commit>=4.7.0,<5", "nbstripout>=0.9.1,<0.10", "hypothesis>=6.170.14,<7"]

[tool.hatch.build.targets.wheel]
packages = ["common", "gym", "scripts", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "capstones"]
addopts = "-ra --strict-markers --import-mode=importlib --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: optional provider or hosted-service call; requires --live",
  "integration: optional local infrastructure; requires --integration",
]
filterwarnings = [
  "error::DeprecationWarning:langgraph.*",
  "error::DeprecationWarning:langchain.*",
  "error::langgraph.warnings.LangGraphDeprecationWarning",
  "error::langchain_core._api.deprecation.LangChainDeprecationWarning",
  "default::langchain_core._api.beta_decorator.LangChainBetaWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["workspace", "tmp", "docs/verification", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"] # Explicit cancellation handling is useful in teaching examples.

[tool.ruff.lint.per-file-ignores]
"gym/tasks/**/*.py" = ["F841", "B007"] # Deliberate faults can leave a result or loop variable unused.

[tool.ruff.format]
quote-style = "double"
