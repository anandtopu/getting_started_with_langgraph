name: Runnable example or gym bug
description: Report a reproducible problem using synthetic data.
body:
  - type: input
    id: command
    attributes:
      label: Exact command
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: OS, Python version, and check_env output. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include a small synthetic input and the error message.
    validations:
      required: true
