name: Course acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  LANGSMITH_TRACING: 'false'
  LANGCHAIN_TRACING_V2: 'false'
  PYTHONUTF8: '1'
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/check_env.py
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/verify_apis.py
      - run: uv run --no-sync python scripts/validate_gym.py --task 00-01
      - run: uv run --no-sync python scripts/run_all_examples.py
      - run: uv run --no-sync python scripts/check_coverage.py --release
      - run: uv run --no-sync python scripts/check_legacy_apis.py
      - run: uv run --no-sync python scripts/check_links.py
  complete:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --all-extras --group maintain
      - run: npm ci
      - run: npm run typecheck
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/check_providers.py
      - run: uv run --no-sync python scripts/check_local_server.py
      - run: uv run --no-sync python scripts/validate_gym.py --release --jobs 4
      - run: uv run --no-sync python scripts/validate_capstones.py
      - run: uv run --no-sync python scripts/run_all_examples.py
      - run: uv run --no-sync python scripts/check_notebooks.py
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LARKSPUR_DB_PASSWORD: synthetic_ci_database_password
      LARKSPUR_CUSTOMER_TOKEN: synthetic_ci_customer_token_only
      LARKSPUR_ADJUSTER_TOKEN: synthetic_ci_adjuster_token_only
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --locked --extra apps
      - run: docker compose up --build --wait
      - run: uv run --no-sync python scripts/check_deployment.py start
      - run: docker compose restart api
      - run: docker compose up --wait
      - run: uv run --no-sync python scripts/check_deployment.py resume
      - run: docker compose exec -T api /app/.venv/bin/python scripts/check_postgres.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
  public-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/check_links.py --external
